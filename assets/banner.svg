<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Animated Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes streamMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-node-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-node-2 { animation: floatSlow 9s ease-in-out infinite 1.5s; }
      .floating-node-3 { animation: floatSlow 8s ease-in-out infinite 3s; }
      .pulsing-orb { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .data-stream {
        stroke-dasharray: 12 18;
        animation: streamMove 8s linear infinite;
      }
      .radar-arm {
        transform-origin: 1050px 100px;
        animation: radarSweep 10s linear infinite;
      }
      .font-sans {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Background Orbs (Behind content) -->
  <g class="pulsing-orb" opacity="0.4">
    <circle cx="150" cy="90" r="130" fill="url(#glow-grad)" filter="url(#glow)" />
    <circle cx="1060" cy="310" r="160" fill="url(#glow-grad)" filter="url(#glow)" />
  </g>

  <!-- Interactive / Moving Data Flow Streams (Background Layer) -->
  <path class="data-stream" d="M -50 210 Q 300 80 600 210 T 1250 210" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
  <path class="data-stream" d="M -50 250 Q 350 380 700 250 T 1250 250" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.25" style="animation-direction: reverse; animation-duration: 10s;" />

  <!-- Animated Node Elements in Background Corners -->
  <g class="floating-node-1">
    <circle cx="1050" cy="100" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="1050" cy="100" r="6" fill="#38bdf8" filter="url(#subtle-glow)" />
    <line class="radar-arm" x1="1050" y1="100" x2="1085" y2="70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
    <text x="1050" y="165" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans" letter-spacing="1">DISTRIBUTED CLOUD</text>
  </g>

  <g class="floating-node-2">
    <rect x="80" y="270" width="110" height="48" rx="8" fill="url(#badge-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="102" cy="294" r="5" fill="#10b981" />
    <text x="116" y="298" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">PARALLEL</text>
    <text x="116" y="310" fill="#94a3b8" font-size="9" font-weight="500" class="font-sans">EXECUTION</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Tags) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" filter="url(#subtle-glow)" />
    <circle cx="-116" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="6" y="5" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2" class="font-sans">CURATED INFRASTRUCTURE</text>
  </g>

  <!-- Main Headline Title (Crisp, High Contrast, Guaranteed Legibility) -->
  <text x="600" y="150" text-anchor="middle" fill="url(#title-grad)" font-size="40" font-weight="900" class="font-sans" letter-spacing="-0.5" filter="url(#subtle-glow)">
    Awesome Cloud Automated Test Execution Engine
  </text>

  <!-- Tagline / Subtitle -->
  <text x="600" y="200" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="600" class="font-sans">
    Scalable Cloud Grid, Parallel Orchestration &amp; Continuous Testing Runtime
  </text>

  <!-- Tertiary Descriptive Line -->
  <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400" class="font-sans">
    Curated SaaS Platforms • High-Performance Open-Source Runners • Kubernetes Browser Clusters
  </text>

  <!-- Feature Pills / Highlights (Centered Foreground) -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: Selenium & Playwright -->
    <g transform="translate(-370, 0)">
      <rect x="0" y="0" width="165" height="38" rx="8" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="82" y="24" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">⚡ Parallel Grid</text>
    </g>

    <!-- Pill 2: Distributed Devices -->
    <g transform="translate(-190, 0)">
      <rect x="0" y="0" width="175" height="38" rx="8" fill="url(#badge-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="87" y="24" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">📱 Real Devices</text>
    </g>

    <!-- Pill 3: K8s & Docker -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="175" height="38" rx="8" fill="url(#badge-grad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
      <text x="87" y="24" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">☸️ Kubernetes Native</text>
    </g>

    <!-- Pill 4: Zero Flakiness -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="url(#badge-grad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <text x="90" y="24" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">🚀 AI Smart Routing</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="250" y1="365" x2="950" y2="365" stroke="url(#title-grad)" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round" />
  <circle cx="600" cy="365" r="3.5" fill="#818cf8" />
</svg>
