acity=".6" stroke-width="1" filter="url(#subtle-glow)" rx="18"/><circle cx="-116" cy="0" r="4" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3;1;0.3"/></circle><text x="6" y="5" fill="#38bdf8" class="font-sans" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">CURATED INFRASTRUCTURE</text></g><text x="600" y="150" fill="url(#title-grad)" class="font-sans" filter="url(#subtle-glow)" font-size="40" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Cloud Automated Test Execution Engine</text><text x="600" y="200" fill="#f8fafc" class="font-sans" font-size="19" font-weight="600" text-anchor="middle">Scalable Cloud Grid, Parallel Orchestration &amp; Continuous Testing Runtime</text><text x="600" y="235" fill="#94a3b8" class="font-sans" font-size="14" font-weight="400" text-anchor="middle">Curated SaaS Platforms • High-Performance Open-Source Runners • Kubernetes Browser Clusters</text><g><g transform="translate(600, 290) translate(-370, 0)"><rect width="165" height="38" x="0" y="0" fill="url(#badge-grad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="8"/><text x="82" y="24" fill="#e2e8f0" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">⚡ Parallel Grid</text></g><g transform="translate(600, 290) translate(-190, 0)"><rect width="175" height="38" x="0" y="0" fill="url(#badge-grad)" stroke="#818cf8" stroke-opacity=".4" stroke-width="1" rx="8"/><text x="87" y="24" fill="#e2e8f0" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">📱 Real Devices</text></g><g transform="translate(600, 290) translate(0, 0)"><rect width="175" height="38" x="0" y="0" fill="url(#badge-grad)" stroke="#c084fc" stroke-opacity=".4" stroke-width="1" rx="8"/><text x="87" y="24" fill="#e2e8f0" class="font-sans" font-size="12" font-weight="600" text-anchor="middle">☸️ Kubernetes Native</text></g><g transform="translate(600, 290) translate(190, 0)"><rect width="180" 