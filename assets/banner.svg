<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><linearGradient id="badge-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtle-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".35" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity=".25"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.02)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes streamMove{0%{stroke-dashoffset:400}}@keyframes radarSweep{0%{transform:rotate(0deg)}}.floating-node-1{animation:floatSlow 7s ease-in-out infinite}.floating-node-2{animation:floatSlow 9s ease-in-out infinite 1.5s}.pulsing-orb{animation:pulseGlow 5s ease-in-out i